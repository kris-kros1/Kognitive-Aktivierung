<style>
:root{--ink:#18232a;--muted:#5d6b73;--yellow:#ffd43b;--blue:#dff1ff;--green:#e6f5dc;--orange:#ffe7c2;--line:#dce4e8}
*{box-sizing:border-box} body{margin:0;font-family:ui-rounded,"Avenir Next",Avenir,system-ui,sans-serif;color:var(--ink);background:#f4f6f7}

<style>

};
const slides=[{"week": 1, "unit": "A", "topic": "Zerlegen und Ergänzen", "problem": "Auf dem Tisch liegen 10 Plättchen. Einige sind rot, der Rest blau. Welche verschiedenen Möglichkeiten kann es geben? Wie wissen wir, dass wir alle gefunden haben?"}, {"week": 1, "unit": "B", "topic": "Zerlegen und Ergänzen", "problem": "Mia sagt: „Wenn ich bei einer Zerlegung der 10 links 1 dazunehme, muss ich rechts 1 wegnehmen.“ Stimmt das immer? Wie können wir die Klasse überzeugen?"}, {"week": 2, "unit": "A", "topic": "Zahlenbeziehungen bis 20", "problem": "Ich denke mir zwei Zahlen. Ihr Abstand ist 5. Welche Zahlen könnte ich meinen? Findet möglichst viele Möglichkeiten und ordnet sie so, dass man ein Muster erkennt."}, {"week": 2, "unit": "B", "topic": "Zahlenbeziehungen bis 20", "problem": "Welche Zahl passt nicht gut zu den anderen: 8, 10, 12, 15? Gibt es mehr als eine begründbare Antwort?"}, {"week": 3, "unit": "A", "topic": "Verdoppeln und Fast-Verdoppeln", "problem": "Ohne einzeln weiterzuzählen: Wie können uns bekannte Doppelaufgaben helfen, 7+8 zu lösen? Sammelt verschiedene Ideen."}, {"week": 3, "unit": "B", "topic": "Verdoppeln und Fast-Verdoppeln", "problem": "Lea behauptet: „Bei zwei Nachbarzahlen kann ich immer die kleinere Zahl verdoppeln und 1 addieren.“ Was meint sie? Gilt das immer?"}, {"week": 4, "unit": "A", "topic": "Tauschaufgaben", "problem": "Warum haben 4+7 und 7+4 dasselbe Ergebnis? Findet eine Erklärung, die auch ein Erstklässler verstehen würde."}, {"week": 4, "unit": "B", "topic": "Tauschaufgaben", "problem": "Bei welchen Rechenarten darf man Zahlen einfach vertauschen? Untersucht Beispiele und Gegenbeispiele."}, {"week": 5, "unit": "A", "topic": "Umkehraufgaben", "problem": "An der Tafel steht nur 8+7=15. Welche weiteren Rechnungen stecken in dieser einen Rechnung? Warum gehören sie zusammen?"}, {"week": 5, "unit": "B", "topic": "Umkehraufgaben", "problem": "Ich verdecke eine Zahl: □+9=16. Wie kann man die fehlende Zahl auf mindestens zwei verschiedene Arten finden?"}, {"week": 6, "unit": "A", "topic": "Plus über den Zehner", "problem": "8+7 – Wie viele verschiedene schlaue Rechenwege finden wir, ohne alles weiterzuzählen? Welcher nutzt die 10 besonders gut?"}, {"week": 6, "unit": "B", "topic": "Plus über den Zehner", "problem": "Noah rechnet 9+6 als 9+1+5. Warum zerlegt er gerade die 6 so? Was würde bei 8+6 sinnvoll sein?"}, {"week": 7, "unit": "A", "topic": "Minus über den Zehner", "problem": "15−7 – Wie können wir die 10 als Zwischenstopp nutzen? Zeichnet oder erklärt verschiedene Wege."}, {"week": 7, "unit": "B", "topic": "Minus über den Zehner", "problem": "Bei 14−8 rechnet ein Kind 14−4−4. Ein anderes 14−10+2. Sind beide Wege richtig? Was steckt dahinter?"}, {"week": 8, "unit": "A", "topic": "Rechenwege vergleichen", "problem": "Für 8+9 gibt es die Wege 8+2+7 und 8+8+1. Welcher Weg ist geschickter – oder kann man das gar nicht allgemein sagen?"}, {"week": 8, "unit": "B", "topic": "Rechenwege vergleichen", "problem": "Zwei Kinder rechnen 16−7 unterschiedlich. Welche Kriterien brauchen wir, um Rechenwege fair zu vergleichen?"}, {"week": 9, "unit": "A", "topic": "Zehner und Einer", "problem": "Eine Zahl kann als 5 Zehner und 12 Einer dargestellt werden. Welche Zahl ist es? Warum ist diese Darstellung erlaubt?"}, {"week": 9, "unit": "B", "topic": "Zehner und Einer", "problem": "Findet möglichst viele verschiedene Darstellungen für 74 mit Zehnern und Einern. Was bleibt immer gleich?"}, {"week": 10, "unit": "A", "topic": "Zahlen vergleichen", "problem": "72 und 69: Ein Kind sagt 69 sei größer, weil 9 größer als 2 ist. Wie können wir zeigen, wo der Denkfehler liegt?"}, {"week": 10, "unit": "B", "topic": "Zahlen vergleichen", "problem": "Erfindet zwei zweistellige Zahlen, bei denen erst die Einerstelle entscheidet, welche größer ist. Was muss dafür gelten?"}, {"week": 11, "unit": "A", "topic": "Zahlenstrahl", "problem": "Welche Zahl liegt genau gleich weit von 46 und 54 entfernt? Wie kann man das herausfinden, ohne alle Zahlen abzuzählen?"}, {"week": 11, "unit": "B", "topic": "Zahlenstrahl", "problem": "Eine Zahl liegt näher an 70 als an 60. Welche Zahlen könnten gemeint sein? Wo liegen die Grenzen?"}, {"week": 12, "unit": "A", "topic": "Zehnersprünge", "problem": "Was verändert sich an einer Zahl bei +10 – und was bleibt gleich? Untersucht 34, 58 und 97."}, {"week": 12, "unit": "B", "topic": "Zehnersprünge", "problem": "Startzahl gesucht: Nach vier Zehnersprüngen lande ich bei 76. Wo bin ich gestartet? Welche Darstellung hilft?"}, {"week": 13, "unit": "A", "topic": "Übergang erkennen", "problem": "Sortiert gedanklich: 47+2, 47+5, 62−3, 62−5. Welche Aufgaben überschreiten einen Zehner? Woran erkennt man das vor dem Rechnen?"}, {"week": 13, "unit": "B", "topic": "Übergang erkennen", "problem": "Erfindet eine Plus- und eine Minusaufgabe, bei der man ganz knapp über einen Zehner gehen muss. Was bedeutet „knapp“?"}, {"week": 14, "unit": "A", "topic": "Kleine und große Aufgaben", "problem": "Wenn 8+7=15 sicher bekannt ist: Welche größeren Aufgaben können wir damit sofort leichter lösen? Sammelt ein Aufgabennetz."}, {"week": 14, "unit": "B", "topic": "Kleine und große Aufgaben", "problem": "Warum hilft 7+6 bei 47+6, obwohl 47 viel größer als 7 ist? Erklärt den Zusammenhang mit Stellenwerten."}, {"week": 15, "unit": "A", "topic": "Minus: kleine und große Aufgaben", "problem": "Wenn 14−8=6 bekannt ist: Bei welchen größeren Minusaufgaben kann diese kleine Aufgabe helfen?"}, {"week": 15, "unit": "B", "topic": "Minus: kleine und große Aufgaben", "problem": "64−8: Wie steckt 14−8 darin? Findet eine Erklärung mit Zahlenstrahl, Material oder Zerlegung."}, {"week": 16, "unit": "A", "topic": "Zweistellig plus", "problem": "48+27: Findet möglichst unterschiedliche Wege. Welche nutzen Zerlegen, welche Ausgleichen, welche die Zehnerstruktur?"}, {"week": 16, "unit": "B", "topic": "Zweistellig plus", "problem": "Bei 48+27 schlägt jemand +30−3 vor. Warum funktioniert das? Für welche Aufgaben wäre diese Idee besonders günstig?"}, {"week": 17, "unit": "A", "topic": "Zweistellig minus", "problem": "81−19: Wie kann man rechnen, ohne umständlich 19 einzelne Schritte zurückzugehen?"}, {"week": 17, "unit": "B", "topic": "Zweistellig minus", "problem": "Warum darf man bei 72−19 zuerst 20 abziehen und danach 1 wieder dazutun? Erklärt es so, dass es mathematisch überzeugt."}, {"week": 18, "unit": "A", "topic": "Strategie auswählen", "problem": "Drei Aufgaben: 58+19, 71−29, 46+7. Würdet ihr bei allen dieselbe Strategie verwenden? Begründet eure Entscheidungen."}, {"week": 18, "unit": "B", "topic": "Strategie auswählen", "problem": "Erfindet eine Aufgabe, bei der „erst 20, dann 1 zurück“ besonders geschickt ist – und eine, bei der diese Strategie ungeschickt wäre."}, {"week": 19, "unit": "A", "topic": "Fehler als Denkchance", "problem": "Ein Kind schreibt 58+7=515. Wie könnte es gedacht haben? Findet nicht nur das richtige Ergebnis, sondern erklärt den möglichen Denkfehler."}, {"week": 19, "unit": "B", "topic": "Fehler als Denkchance", "problem": "72−9=61 steht im Heft. Welche Prüfidee zeigt schnell, dass etwas nicht stimmen kann?"}, {"week": 20, "unit": "A", "topic": "Rechenkonferenz", "problem": "63−18: Sammelt drei verschiedene Wege. Was ist an allen Wegen mathematisch gleich, obwohl sie anders aussehen?"}, {"week": 20, "unit": "B", "topic": "Rechenkonferenz", "problem": "Was macht einen Rechenweg „geschickt“? Entwickelt gemeinsam drei Kriterien und testet sie an 47+28."}, {"week": 21, "unit": "A", "topic": "Multiplikation als Gruppen", "problem": "Auf dem Bild wären 4 gleich große Tüten mit je 6 Murmeln. Welche Rechnungen beschreiben die Situation? Was bedeutet dabei jede Zahl?"}, {"week": 21, "unit": "B", "topic": "Multiplikation als Gruppen", "problem": "12 Plättchen sollen in gleich große Gruppen gelegt werden. Welche verschiedenen Gruppierungen sind möglich? Welche Malaufgaben entstehen?"}, {"week": 22, "unit": "A", "topic": "Multiplikation als Rechteck", "problem": "12 Punkte: Welche verschiedenen Rechtecke können wir daraus legen? Was verraten die Rechtecke über Malaufgaben?"}, {"week": 22, "unit": "B", "topic": "Multiplikation als Rechteck", "problem": "Warum ist 3·7 genauso viel wie 7·3? Eine Erklärung nur mit „weil Tauschaufgabe“ reicht heute nicht."}, {"week": 23, "unit": "A", "topic": "Kernaufgaben", "problem": "Wie kann 5·8 helfen, wenn wir 6·8 noch nicht sicher wissen? Welche Veränderung passiert im Bild und in der Rechnung?"}, {"week": 23, "unit": "B", "topic": "Kernaufgaben", "problem": "10·7 ist bekannt. Welche Aufgaben in der Nähe können wir daraus besonders leicht ableiten? Baut ein Aufgabennetz."}, {"week": 24, "unit": "A", "topic": "Viererreihe verstehen", "problem": "2·7 ist bekannt. Wie können wir daraus 4·7 herausfinden, ohne die Viererreihe aufzusagen?"}, {"week": 24, "unit": "B", "topic": "Viererreihe verstehen", "problem": "Wenn 4·6 bekannt ist, kann daraus auch 8·6 entstehen. Welche Operation steckt in diesem Zusammenhang?"}, {"week": 25, "unit": "A", "topic": "Nachbaraufgaben Mal", "problem": "9·6: Warum ist 10·6−6 ein sinnvoller Weg? Zeigt den Zusammenhang an Gruppen oder einem Punktefeld."}, {"week": 25, "unit": "B", "topic": "Nachbaraufgaben Mal", "problem": "Für 7·4 nennt die Klasse verschiedene Hilfsaufgaben. Welche sind richtig? Welche ist besonders leicht weiterzurechnen?"}, {"week": 26, "unit": "A", "topic": "Einmaleins-Netze", "problem": "Das Ergebnis 24 steht in der Mitte. Welche Mal-, Tausch- und Geteiltaufgaben können wir darum herum anordnen?"}, {"week": 26, "unit": "B", "topic": "Einmaleins-Netze", "problem": "Wie hängen 3·8, 6·4 und 24:4 zusammen? Findet eine Darstellung, in der man die Beziehungen sehen kann."}, {"week": 27, "unit": "A", "topic": "Teilen als Verteilen", "problem": "24 Plättchen werden gerecht auf 4 Kinder verteilt. Wie kann man schon vor dem Verteilen überlegen, wie viele jedes Kind bekommt?"}, {"week": 27, "unit": "B", "topic": "Teilen als Verteilen", "problem": "Was verändert sich, wenn dieselben 24 Plättchen auf 6 Kinder verteilt werden? Warum wird der Anteil kleiner?"}, {"week": 28, "unit": "A", "topic": "Teilen als Aufteilen", "problem": "24 Plättchen werden in 4er-Gruppen gelegt. Wie viele Gruppen entstehen? Was ist anders als bei „auf 4 Kinder verteilen“?"}, {"week": 28, "unit": "B", "topic": "Teilen als Aufteilen", "problem": "Zeigt 12:3 einmal als Verteilen und einmal als Aufteilen. Was ist verschieden, was bleibt mathematisch gleich?"}, {"week": 29, "unit": "A", "topic": "Mal und Geteilt vernetzen", "problem": "35:5 ist gesucht. Wie kann eine bekannte Malaufgabe die Division lösen? Welche weiteren Rechnungen gehören zur selben Zahlenfamilie?"}, {"week": 29, "unit": "B", "topic": "Mal und Geteilt vernetzen", "problem": "□·6=42: Muss man ausprobieren? Findet verschiedene Denkwege zur fehlenden Zahl."}, {"week": 30, "unit": "A", "topic": "Geld", "problem": "Ihr habt genau 5 €. Welche unterschiedlichen Zusammenstellungen aus Münzen und Scheinen sind möglich? Wie könnten wir sie systematisch ordnen?"}, {"week": 30, "unit": "B", "topic": "Geld", "problem": "Ein Einkauf kostet 6,50 €, bezahlt wird mit 10 €. Findet verschiedene Wege, das Rückgeld zu bestimmen."}, {"week": 31, "unit": "A", "topic": "Längen", "problem": "Was im Klassenraum ist ungefähr 1 m lang? Wie können wir gute Schätzungen von bloßem Raten unterscheiden?"}, {"week": 31, "unit": "B", "topic": "Längen", "problem": "Ein Kind sagt: „Mein Radiergummi ist 4 Meter lang.“ Wie können wir ohne Messen begründen, dass die Einheit nicht passen kann?"}, {"week": 32, "unit": "A", "topic": "Zeit", "problem": "Von 8:45 Uhr bis 10:15 Uhr: Wie lange ist das? Findet mindestens zwei Wege, die Zeitspanne übersichtlich zu bestimmen."}, {"week": 32, "unit": "B", "topic": "Zeit", "problem": "Eine Veranstaltung dauert 90 Minuten. Welche verschiedenen Start- und Endzeiten sind möglich? Was bleibt immer gleich?"}, {"week": 33, "unit": "A", "topic": "Formen über Eigenschaften", "problem": "Ich denke an eine Form mit vier Seiten und vier rechten Winkeln. Welche Form könnte es sein? Ist die Lösung eindeutig?"}, {"week": 33, "unit": "B", "topic": "Formen über Eigenschaften", "problem": "Ist jedes Quadrat auch ein Rechteck? Diskutiert nur mit Eigenschaften, nicht mit „so sieht es aus“."}, {"week": 34, "unit": "A", "topic": "Symmetrie", "problem": "Wie können wir sicher entscheiden, ob eine Figur achsensymmetrisch ist – ohne uns nur auf das Auge zu verlassen?"}, {"week": 34, "unit": "B", "topic": "Symmetrie", "problem": "Erfindet eine Figur mit genau einer Spiegelachse. Wie könnt ihr beweisen, dass sie nicht noch eine zweite hat?"}, {"week": 35, "unit": "A", "topic": "Würfelgebäude", "problem": "Ein Würfelgebäude sieht von vorne gleich aus. Muss es deshalb aus gleich vielen Würfeln bestehen? Findet Gegenbeispiele."}, {"week": 35, "unit": "B", "topic": "Würfelgebäude", "problem": "Wie beschreibt man ein Würfelgebäude so genau, dass jemand es bauen kann, ohne es zu sehen? Welche Angaben sind nötig?"}, {"week": 36, "unit": "A", "topic": "Sachaufgaben verstehen", "problem": "Zu 12+8 sollen zwei völlig unterschiedliche Geschichten entstehen. Was muss in jeder Geschichte trotzdem mathematisch gleich sein?"}, {"week": 36, "unit": "B", "topic": "Sachaufgaben verstehen", "problem": "Eine Sachaufgabe enthält eine Zahl, die man gar nicht braucht. Wie erkennt man überflüssige Informationen?"}, {"week": 37, "unit": "A", "topic": "Systematisch Problemlösen", "problem": "Findet alle Zahlenpaare mit Summe 15. Wie ordnen wir unsere Suche, damit garantiert keine Möglichkeit fehlt?"}, {"week": 37, "unit": "B", "topic": "Systematisch Problemlösen", "problem": "Aus den Ziffern 1, 2 und 3 sollen zweistellige Zahlen ohne Wiederholung entstehen. Wie finden wir wirklich alle?"}, {"week": 38, "unit": "A", "topic": "Muster erforschen", "problem": "1, 2, 4, … Wie könnte die Folge weitergehen? Gibt es nur eine richtige Antwort? Welche Regel macht eure Fortsetzung gültig?"}, {"week": 38, "unit": "B", "topic": "Muster erforschen", "problem": "5, 10, 15, 21, 25: Etwas stört. Was könnte die Regel gewesen sein und wie lässt sich der Fehler begründen?"}, {"week": 39, "unit": "A", "topic": "Mathematische Beziehungen", "problem": "Wie hängen 6·4, 24:6, 12+12 und 30−6 miteinander zusammen? Baut aus den Rechnungen ein Beziehungsnetz."}, {"week": 39, "unit": "B", "topic": "Mathematische Beziehungen", "problem": "Welche Idee aus diesem Schuljahr hilft euch an besonders vielen Stellen in Mathematik? Wählt eine und zeigt mindestens drei Anwendungen."}];
let idx=0, remaining=600, timer=null;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderWeeks(){
 let h=''; for(let w=1;w<=39;w++) h+=`<button class="week ${Math.floor(idx/2)+1===w?'active':''}" onclick="goWeek(${w})">Woche ${w} · ${esc(slides[(w-1)*2].topic)}</button>`;
 document.getElementById('weeks').innerHTML=h;
}
function visual(s){
 const x=(s.topic+" "+s.problem).toLowerCase();
 if(x.includes("zerlegen") && s.week===1) return `<div class="visual dots"><span>🔴 🔴 🔴 🔴 🔴 🔴</span><span>🔵 🔵 🔵 🔵</span><b>10 Plättchen – welche anderen Aufteilungen gibt es?</b></div>`;
 if(x.includes("verdoppeln")) return `<div class="visual equation">7 + 8 = ?<div class="small">💡 7+7 &nbsp; oder &nbsp; 8+8</div></div>`;
 if(x.includes("tausch")) return `<div class="visual equation">●●●● + ●●●●●●●<br><span class="arrow">↕</span><br>●●●●●●● + ●●●●</div>`;
 if(x.includes("zahlenstrahl")) return `<div class="visual line"><div>46 ───── ? ───── 54</div></div>`;
 if(x.includes("zehner") && (x.includes("stellen")||x.includes("einer"))) return `<div class="visual place"><div><b>Z</b><b>E</b></div><div><strong>5</strong><strong>12</strong></div><span>Welche Zahl ist das?</span></div>`;
 if(x.includes("rechteck")||x.includes("punkte")) return `<div class="visual gridpic">${Array(12).fill("<i></i>").join("")}</div>`;
 if(x.includes("würfelgebäude")) return `<div class="visual cubes">🧊<br>🧊 🧊<br>🧊 🧊 🧊</div>`;
 if(x.includes("symmetrie")) return `<div class="visual symmetry">◀︎ ◆ ● │ ● ◆ ▶︎<div class="small">Wo ist die Spiegelachse?</div></div>`;
 if(x.includes("geld")||x.includes("€")) return `<div class="visual equation">💶 10 €<br>− 6,50 €<br>= ?</div>`;
 if(x.includes("zeit")||x.includes("uhr")) return `<div class="visual equation">🕘 8:45 &nbsp; → &nbsp; 🕙 10:15<div class="small">Wie viel Zeit vergeht?</div></div>`;
 return "";
}
function shortProblem(s){
 let p=s.problem;
 // Keep the mathematical challenge, remove some repeated meta wording on the slide.
 p=p.replace(/ Sammelt verschiedene Ideen\.$/,"")
    .replace(/ Findet eine Erklärung, die auch ein Erstklässler verstehen würde\.$/,"")
    .replace(/ Zeichnet oder erklärt verschiedene Wege\.$/,"")
    .replace(/ Wie können wir die Klasse überzeugen\?$/,"");
 return p;
}
function render(){
 const s=slides[idx]; remaining=600; stopTimer();
 const pic=visual(s);
 document.getElementById('card').innerHTML=`
 <div class="top"><div><div class="kicker">Woche ${s.week} · Denkimpuls ${s.unit}</div><div class="sub">${esc(s.topic)} · ca. 10 Minuten · Plenum</div></div>
 <div class="timer"><span class="time" id="time">10:00</span><button class="secondary" onclick="toggleTimer()" id="tbtn">▶ Start</button><button class="secondary" onclick="resetTimer()">↺</button></div></div>
 <div class="material"><b>🧰 Material:</b> ${materialFor(s)}</div>
 <div class="problem"><div class="label">🧩 DENKPROBLEM</div>${pic}<div class="text">${esc(shortProblem(s))}</div></div>
 <div class="micro"><span>💭 <b>Was vermutet ihr?</b></span><span>👀 <b>Wie könnt ihr es zeigen?</b></span><span>💬 <b>Warum stimmt das?</b></span></div>
 <div class="teacher"><b>Nur wenn nötig:</b> „Was fällt euch auf?“ · „Gilt das immer?“ · „Wer sieht es anders?“</div>
 <div class="controls"><button class="secondary" onclick="prev()">← vorherige Einheit</button><button class="primary" onclick="next()">nächste Einheit →</button></div>`;
 renderWeeks();
}
function fmt(){let m=Math.floor(remaining/60),s=remaining%60; return `${m}:${String(s).padStart(2,'0')}`}
function tick(){remaining=Math.max(0,remaining-1); const el=document.getElementById('time'); if(el)el.textContent=fmt(); if(!remaining)stopTimer()}
function toggleTimer(){if(timer)stopTimer();else{timer=setInterval(tick,1000);document.getElementById('tbtn').textContent='⏸ Pause'}}
function stopTimer(){if(timer){clearInterval(timer);timer=null} const b=document.getElementById('tbtn');if(b)b.textContent='▶ Start'}
function resetTimer(){stopTimer();remaining=600;const e=document.getElementById('time');if(e)e.textContent='10:00'}
function next(){idx=Math.min(slides.length-1,idx+1);render()} function prev(){idx=Math.max(0,idx-1);render()}
function goWeek(w){idx=(w-1)*2;render()}
render();
</script></body></html>
